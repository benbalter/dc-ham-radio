# Dire Wolf config for a Digirig Mobile + Baofeng UV-5R, 1200-baud packet.
#
# Don't run this file directly: scripts/digirig.py fills in the sound card and
# serial port placeholders with the devices it finds, then writes
# out/direwolf.conf.
#
# The Digirig is a USB hub with a CM108 sound card and a CP2102 serial port.
# Its PTT is wired to the CP2102's RTS line, and macOS names the port
# /dev/cu.usbserial-<suffix>, where the suffix can change between USB sockets.

# macOS uses PortAudio, so devices are named, not numbered. The Digirig's
# CM108 shows up as "USB Audio Device".
ADEVICE "@ADEVICE@" "@ADEVICE@"
ACHANNELS 1

CHANNEL 0
MYCALL KO6EYB
MODEM 1200

# Key the radio by raising RTS on the Digirig's serial port.
PTT @PTT_PORT@ RTS

# 300 ms between keying and data (units of 10 ms). If gateways miss the start
# of your frames, try 40 or 50: the UV-5R is slow to come up to full power.
TXDELAY 30

# Pat connects through the AGW interface. Dire Wolf listens on every network
# interface, not just localhost, so any client on the LAN could key the radio:
# if macOS asks whether direwolf may accept incoming connections, choose Deny.
AGWPORT 8000

# KISS isn't needed for Winlink, so it's off to leave one less open port.
KISSPORT 0
